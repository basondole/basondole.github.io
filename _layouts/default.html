<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: "Documentation" }}</title>

<!-- GitHub-style syntax highlighting theme -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css"
>

<!-- Highlight.js engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
            "Noto Sans", Helvetica, Arial, sans-serif,
            "Apple Color Emoji", "Segoe UI Emoji";
        line-height: 1.5;
        max-width: 980px;
        margin: 0 auto;
        padding: 45px 20px;
        color: #1f2328;
        background-color: #ffffff;
    }

    h1, h2, h3 {
        font-weight: 600;
        line-height: 1.25;
        margin-top: 24px;
        margin-bottom: 16px;
        padding-bottom: .3em;
        border-bottom: 1px solid rgba(175, 184, 193, 0.2);
    }

    h4, h5, h6 {
        font-weight: 600;
        margin-top: 24px;
        margin-bottom: 16px;
    }

    p, ul, ol, blockquote, table {
        margin-top: 0;
        margin-bottom: 16px;
    }

    a {
        color: #0969da;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    /* Inline code */
    code:not(.hljs) {
        background-color: rgba(175, 184, 193, 0.2);
        padding: .2em .4em;
        border-radius: 6px;
        font-size: 85%;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo,
            Consolas, Liberation Mono, monospace;
    }

    /* Code block container */
    pre {
        background-color: #f6f8fa;
        padding: 16px;
        border-radius: 6px;
        overflow-x: auto;
        margin-top: 0;
        margin-bottom: 16px;
        text-align: left;
        white-space: pre;
        tab-size: 4;
    }

    /* Highlighted and plain code blocks */
    pre code,
    pre code.hljs {
        display: block;
        margin: 0;
        padding: 0;
        text-indent: 0;
        text-align: left;
        background: transparent;
        white-space: pre;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo,
            Consolas, Liberation Mono, monospace;
        font-size: 85%;
        line-height: 1.45;
    }

    /* Plain text blocks: no guessed syntax colors */
    pre code.nohighlight {
        color: #1f2328;
    }

    /* GitHub-style Markdown blockquotes */
    blockquote {
        margin: 0 0 16px;
        padding: 0 1em;
        color: #59636e;
        border-left: 0.25em solid #d1d9e0;
    }

    blockquote > :first-child {
        margin-top: 0;
    }

    blockquote > :last-child {
        margin-bottom: 0;
    }

    /* Tables */
    table {
        border-spacing: 0;
        border-collapse: collapse;
        display: block;
        width: max-content;
        max-width: 100%;
        overflow: auto;
    }

    th, td {
        padding: 6px 13px;
        border: 1px solid #d1d9e0;
    }

    th {
        font-weight: 600;
    }

    tr:nth-child(2n) {
        background-color: #f6f8fa;
    }

    /* Mermaid diagrams */
    .mermaid {
        background: transparent !important;
        text-align: center;
        margin: 24px 0;
    }

    img {
        max-width: 100%;
        height: auto;
    }

    hr {
        height: .25em;
        padding: 0;
        margin: 24px 0;
        background-color: #d1d9e0;
        border: 0;
    }
</style>


</head>
<body>

{{ content }}

<!-- Mermaid rendering and syntax highlighting -->
<script type="module">
    import mermaid from
        'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
        startOnLoad: false,
        theme: 'default'
    });

    document.addEventListener("DOMContentLoaded", async function () {

        // Step A: Convert Mermaid fences into diagram containers
        document.querySelectorAll("pre > code.language-mermaid")
            .forEach((codeElement) => {
                const preElement = codeElement.parentElement;
                const diagramSyntax = codeElement.textContent.trim();

                const canvasContainer = document.createElement("div");
                canvasContainer.className = "mermaid";
                canvasContainer.textContent = diagramSyntax;

                preElement.parentElement.replaceChild(
                    canvasContainer,
                    preElement
                );
            });

        // Step B: Render Mermaid diagrams
        try {
            await mermaid.run();
        } catch (err) {
            console.error("Mermaid rendering error:", err);
        }

        // Step C: Highlight only explicitly labelled languages
        if (window.hljs) {
            document.querySelectorAll("pre code").forEach((block) => {

                // Mermaid is handled separately
                if (block.classList.contains("language-mermaid")) {
                    return;
                }

                // Find an explicitly specified language
                const languageClass = [...block.classList].find(
                    name => name.startsWith("language-")
                );

                // Unlabelled fences remain plain text
                if (!languageClass) {
                    block.classList.add("nohighlight");
                    return;
                }

                const language = languageClass.slice(
                    "language-".length
                );

                // Explicit plain-text fences remain unhighlighted
                if (language === "text" || language === "plaintext") {
                    block.classList.add("nohighlight");
                    return;
                }

                // Highlight only languages supported by Highlight.js
                if (window.hljs.getLanguage(language)) {
                    window.hljs.highlightElement(block);
                } else {
                    block.classList.add("nohighlight");
                }
            });
        } else {
            console.error("Highlight.js failed to load.");
        }
    });
</script>


</body>
</html>
