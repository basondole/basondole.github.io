<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: "Documentation" }}</title>

<!-- GitHub-style typography and Rouge syntax highlighting -->
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
            "Noto Sans", Helvetica, Arial, sans-serif,
            "Apple Color Emoji", "Segoe UI Emoji";
        line-height: 1.5;
        max-width: 980px;
        margin: 0 auto;
        padding: 45px 20px;
        color: #1f2328;
        background-color: #ffffff;
    }

    h1, h2, h3 {
        font-weight: 600;
        line-height: 1.25;
        margin-top: 24px;
        margin-bottom: 16px;
        padding-bottom: .3em;
        border-bottom: 1px solid rgba(175, 184, 193, 0.2);
    }

    h4, h5, h6 {
        font-weight: 600;
        margin-top: 24px;
        margin-bottom: 16px;
    }

    p, ul, ol, table {
        margin-top: 0;
        margin-bottom: 16px;
    }

    a {
        color: #0969da;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    /* Inline code */
    code:not(pre code) {
        background-color: rgba(175, 184, 193, 0.2);
        padding: .2em .4em;
        border-radius: 6px;
        font-size: 85%;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo,
            Consolas, Liberation Mono, monospace;
    }

    /* Code blocks generated by Jekyll and Rouge */
    div.highlighter-rouge,
    div.highlight {
        margin-bottom: 16px;
    }

    pre,
    .highlight pre {
        background-color: #f6f8fa;
        padding: 16px;
        border-radius: 6px;
        overflow-x: auto;
        margin: 0;
        text-align: left;
        white-space: pre;
        tab-size: 4;
        overflow-wrap: normal;
    }

    pre code,
    .highlight pre code {
        display: block;
        margin: 0;
        padding: 0;
        border: 0;
        text-indent: 0;
        text-align: left;
        white-space: pre;
        background: transparent;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo,
            Consolas, Liberation Mono, monospace;
        font-size: 85%;
        line-height: 1.45;
    }

    /*
     * Rouge/Pygments token colors inspired by GitHub's light theme.
     * Rouge uses short classes such as k, s, c, n and o.
     * These are not Highlight.js classes.
     */

    /* Comments */
    .highlight .c,
    .highlight .ch,
    .highlight .cm,
    .highlight .c1,
    .highlight .cs,
    .highlight .cp,
    .highlight .cpf {
        color: #6e7781;
        font-style: italic;
    }

    /* Keywords and declarations */
    .highlight .k,
    .highlight .kc,
    .highlight .kd,
    .highlight .kn,
    .highlight .kp,
    .highlight .kr,
    .highlight .kt,
    .highlight .ow {
        color: #cf222e;
    }

    /* Strings and string-like values */
    .highlight .s,
    .highlight .sa,
    .highlight .sb,
    .highlight .sc,
    .highlight .dl,
    .highlight .sd,
    .highlight .s2,
    .highlight .se,
    .highlight .sh,
    .highlight .si,
    .highlight .sx,
    .highlight .sr,
    .highlight .s1,
    .highlight .ss {
        color: #0a3069;
    }

    /* Numbers */
    .highlight .m,
    .highlight .mb,
    .highlight .mf,
    .highlight .mh,
    .highlight .mi,
    .highlight .mo,
    .highlight .il {
        color: #0550ae;
    }

    /* Operators */
    .highlight .o,
    .highlight .ow {
        color: #cf222e;
    }

    /* Function and method names */
    .highlight .nf,
    .highlight .fm {
        color: #8250df;
    }

    /* Class, type and namespace names */
    .highlight .nc,
    .highlight .nn,
    .highlight .nt {
        color: #116329;
    }

    /* Built-ins and special constants */
    .highlight .nb,
    .highlight .bp,
    .highlight .no,
    .highlight .vc,
    .highlight .vg,
    .highlight .vi {
        color: #0550ae;
    }

    /* Attributes, properties and identifiers */
    .highlight .na {
        color: #116329;
    }

    .highlight .nd {
        color: #8250df;
    }

    /* Punctuation */
    .highlight .p {
        color: #1f2328;
    }

    /* Errors */
    .highlight .err {
        color: #cf222e;
    }

    /* Deleted and inserted text in diffs */
    .highlight .gd {
        color: #82071e;
        background-color: #ffebe9;
    }

    .highlight .gi {
        color: #116329;
        background-color: #dafbe1;
    }

    /* Plain text and unclassified tokens */
    .highlight .n,
    .highlight .nx {
        color: #1f2328;
    }

    /* GitHub-style Markdown blockquotes */
    blockquote {
        margin: 0 0 16px;
        padding: 0 1em;
        color: #59636e;
        border-left: 0.25em solid #d1d9e0;
    }

    blockquote > :first-child {
        margin-top: 0;
    }

    blockquote > :last-child {
        margin-bottom: 0;
    }

    /* Tables */
    table {
        border-spacing: 0;
        border-collapse: collapse;
        display: block;
        width: max-content;
        max-width: 100%;
        overflow: auto;
        margin-bottom: 16px;
    }

    th, td {
        padding: 6px 13px;
        border: 1px solid #d1d9e0;
    }

    th {
        font-weight: 600;
    }

    tr:nth-child(2n) {
        background-color: #f6f8fa;
    }

    /* Mermaid diagrams */
    .mermaid {
        background: transparent !important;
        text-align: center;
        margin: 24px 0;
    }

    img {
        max-width: 100%;
        height: auto;
    }

    hr {
        height: .25em;
        padding: 0;
        margin: 24px 0;
        background-color: #d1d9e0;
        border: 0;
    }
</style>


</head>
<body>

{{ content }}

<!-- Mermaid rendering only; Rouge handles syntax highlighting -->
<script type="module">
    import mermaid from
        'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
        startOnLoad: false,
        theme: 'default'
    });

    document.addEventListener("DOMContentLoaded", async function () {
        document.querySelectorAll(
            "div.highlighter-rouge.language-mermaid pre code, " +
            "pre > code.language-mermaid"
        ).forEach((codeElement) => {
            const preElement = codeElement.closest("pre");

            if (!preElement) {
                return;
            }

            const wrapper = preElement.closest(".highlighter-rouge, .highlight");
            const diagramSyntax = codeElement.textContent.trim();

            const canvasContainer = document.createElement("div");
            canvasContainer.className = "mermaid";
            canvasContainer.textContent = diagramSyntax;

            if (wrapper && wrapper !== preElement) {
                wrapper.replaceWith(canvasContainer);
            } else {
                preElement.replaceWith(canvasContainer);
            }
        });

        try {
            await mermaid.run({
                querySelector: ".mermaid"
            });
        } catch (err) {
            console.error("Mermaid rendering error:", err);
        }
    });
</script>


</body>
</html>
