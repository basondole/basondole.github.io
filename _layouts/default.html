<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: "Documentation" }}</title>

<!-- GitHub-style syntax highlighting theme -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">

<!-- Highlight.js engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
            "Noto Sans", Helvetica, Arial, sans-serif,
            "Apple Color Emoji", "Segoe UI Emoji";
        line-height: 1.5;
        max-width: 980px;
        margin: 0 auto;
        padding: 45px 20px;
        color: #1f2328;
        background-color: #ffffff;
    }

    h1, h2, h3 {
        font-weight: 600;
        line-height: 1.25;
        margin-top: 24px;
        margin-bottom: 16px;
        padding-bottom: .3em;
        border-bottom: 1px solid rgba(175, 184, 193, 0.2);
    }

    code:not(.hljs) {
        background-color: rgba(175, 184, 193, 0.2);
        padding: .2em .4em;
        border-radius: 6px;
        font-size: 85%;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo,
            Consolas, Liberation Mono, monospace;
    }

    pre {
        background-color: #f6f8fa;
        padding: 16px;
        border-radius: 6px;
        overflow-x: auto;
    }

    pre code.hljs {
        display: block;
        background: transparent;
        padding: 0;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo,
            Consolas, Liberation Mono, monospace;
        font-size: 85%;
    }

    .mermaid {
        background: transparent !important;
        text-align: center;
        margin: 24px 0;
    }
</style>


</head>
<body>

{{ content }}

<!-- Mermaid rendering and syntax highlighting -->
<script type="module">
    import mermaid from
        'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
        startOnLoad: false,
        theme: 'default'
    });

    document.addEventListener("DOMContentLoaded", async function () {
        // Convert Mermaid code blocks into diagram containers
        document.querySelectorAll("pre > code.language-mermaid")
            .forEach((codeElement) => {
                const preElement = codeElement.parentElement;
                const diagramSyntax = codeElement.textContent.trim();

                const canvasContainer = document.createElement("div");
                canvasContainer.className = "mermaid";
                canvasContainer.textContent = diagramSyntax;

                preElement.parentElement.replaceChild(
                    canvasContainer,
                    preElement
                );
            });

        // Render Mermaid diagrams
        try {
            await mermaid.run();
        } catch (err) {
            console.error("Mermaid rendering error:", err);
        }

        // Highlight all other code blocks
        if (window.hljs) {
            document.querySelectorAll("pre code").forEach((block) => {
                if (!block.classList.contains("language-mermaid")) {
                    window.hljs.highlightElement(block);
                }
            });
        } else {
            console.error("Highlight.js failed to load.");
        }
    });
</script>


</body>
</html>
