<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    
    <!-- 1. PULL IN MODERN MERMAID STABLE VERSION FROM CDN -->
    <script type="module">
        import mermaid from 'https://jsdelivr.net';
        
        // Disable automatic start to give the code-fencing converter time to finish
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        document.addEventListener("DOMContentLoaded", async function () {
            // Find every code block compiled from your triple backticks
            const targetCodes = document.querySelectorAll("pre > code.language-mermaid");

            targetCodes.forEach((codeElement) => {
                const preElement = codeElement.parentElement;
                const diagramText = codeElement.textContent.trim();

                // Build the clean container required by the layout engine
                const mermaidDiv = document.createElement("div");
                mermaidDiv.className = "mermaid";
                mermaidDiv.textContent = diagramText;

                // Replace the block element completely
                preElement.parentNode.replaceChild(mermaidDiv, preElement);
            });

            // Trigger the engine to safely compile the chart canvas vectors
            await mermaid.run();
        });
    </script>
    
    <style>
        /* Baseline layout wrapper styles to keep text readable */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #24292e;
            line-height: 1.6;
        }
        /* Prevents standard code blocks from blowing out your page margins */
        pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
        code { background: rgba(27,31,35,0.05); padding: 0.2em 0.4em; border-radius: 3px; font-family: monospace; }
        .mermaid { text-align: center; margin: 24px 0; background: transparent !important; }
    </style>
</head>
<body>

    <!-- CRITICAL: Make sure there are no raw tags wrapping the line below -->
    {{ content }}

</body>
</html>
